services:

  mlflow-tracking-server:
    image: ghcr.io/mlflow/mlflow
    command: mlflow ui --port 5000 --host 0.0.0.0 --backend-store-uri ./mlruns --artifacts-destination ./mlruns
    volumes:
     - ./modelos:/mlruns
    container_name: tracking
    ports:
     - "5000:5000"


 # Rumos Bank service:
  rumos-bank-service:
    build:
      context: .
      dockerfile: Dockerfile.Service 
      tags:
        - rumos-bank-service
        - ghcr.io/filipalagoa/rumos-bank-service 
    image: rumos-bank-service
    container_name: service
    ports:
      - "5003:5003"
